workflows:
  android-workflow:
    name: My Day Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Build My Day APK
        script: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

    artifacts:
      - app/build/outputs/**/*.apk
